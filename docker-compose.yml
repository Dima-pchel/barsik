version: '3.0'
services:
  barsik:
    build: ./barsik
    restart: always
    environment:
      - BARSIK_TOKEN=${BARSIK_TOKEN}
  db:
    image: mysql:5.7
    restart: always
    container_name: mysql   # application.properties подключается к хосту "mysql"
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=barsik
    ports:
      - "3360:3306"
    volumes:
      - mysql_kets:/var/lib/mysql
volumes:
  mysql_kets:
